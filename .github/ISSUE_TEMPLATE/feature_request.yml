name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describe the problem first; the shape of the solution comes second.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who hits it, and when?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Verso to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered (optional)
  - type: dropdown
    id: os
    attributes:
      label: Where does it matter most?
      options:
        - Both macOS and Windows
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues first.
          required: true
